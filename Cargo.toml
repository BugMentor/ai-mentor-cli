[package]
name = "ai-mentor-cli"
version = "0.1.0"
edition = "2021"

[lib]
name = "ai_mentor_cli"
path = "src/lib.rs"

[[bin]]
name = "ai-mentor-cli"
path = "src/main.rs"

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
tokio = { version = "1.0", features = ["full"] }
ollama-rs = { version = "0.3.4", features = ["stream"] }
tokio-stream = "0.1"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tui-input = "0.8"
arboard = "3.4"
regex = "1.10"
glob = "0.3"
walkdir = "2.4"
ignore = "0.4"
once_cell = "1.19"
toml = "1.0.6"
url = "2.5.8"
hnsw_rs = "0.3.4"
uuid = { version = "1.22.0", features = ["v4"] }
anyhow = "1.0.102"
async-trait = "0.1.89"

[dev-dependencies]
tempfile = "3.10"
